[project]
name = "comfyui-h3-mac"
version = "0.5.0"
description = "A bilingual ComfyUI bridge for h3.c and vpipe H3 backends on Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ComfyUI-H3-Mac contributors" }]
dependencies = []

[project.urls]
Repository = "https://github.com/Kingrd97/ComfyUI-H3-Mac"
ComfyUI = "https://github.com/Comfy-Org/ComfyUI"
Engine = "https://github.com/antirez/h3.c"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
