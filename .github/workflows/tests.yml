name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest numpy pillow typing_extensions
      - run: python -m pytest -q
      - run: bash -n Install.command Start.command "Download Model.command" Doctor.command scripts/*.sh
