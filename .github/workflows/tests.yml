name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest numpy pillow typing_extensions
      - run: python -m pytest -q
      - name: Build native responsiveness guardian
        run: >-
          xcrun swiftc -O -warnings-as-errors
          -target arm64-apple-macos12.0
          -framework AppKit -framework CoreGraphics
          -framework CoreVideo -framework QuartzCore
          native/H3Guardian.swift
          -o "$RUNNER_TEMP/h3-guardian"
      - name: Check every shell script
        run: |
          for file in Install.command Start.command "Download Model.command" Doctor.command scripts/*.sh; do
            bash -n "$file"
          done
